services:
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "${PORTAINER_BIND_ADDRESS:-127.0.0.1}:${PORTAINER_PORT:-9443}:9443"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${PORTAINER_DATA_DIR:?Set an absolute host path for Portainer data}
        target: /data
        bind:
          create_host_path: false
