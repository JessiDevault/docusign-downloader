# Portainer Web editor deployment; uses the previously published image digest.
# Import portainer.env.example after setting APP_PASSWORD.
services:
  initialize:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    command:
      - /bin/sh
      - -ec
      - |
        case "$$PUID" in ''|*[!0-9]*) echo 'PUID must be numeric'; exit 1;; esac
        case "$$PGID" in ''|*[!0-9]*) echo 'PGID must be numeric'; exit 1;; esac
        test "$$PUID" -gt 0
        test "$$PGID" -gt 0
        for folder in /config /data /logs; do
          chown "$$PUID:$$PGID" "$$folder"
          chmod 700 "$$folder"
        done
        if test -f /config/private-key.pem; then
          chown "$$PUID:$$PGID" /config/private-key.pem
          chmod 600 /config/private-key.pem
        fi
        echo 'Persistent folders initialized. This container is expected to exit successfully.'
    volumes:
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/logs
        target: /logs
        bind:
          create_host_path: true
  downloader:
    image: ghcr.io/jessidevault/docusign-downloader@sha256:210e62c27f32e2f61b5af47a54323e936a523357d73162d60550e8a381bc056d
    restart: unless-stopped
    user: "${PUID:-10001}:${PGID:-10001}"
    depends_on:
      initialize:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:8080"
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set an application password of at least 16 characters}
      AUTO_ENABLED: ${AUTO_ENABLED:-false}
      AUTO_INTERVAL_SECONDS: ${AUTO_INTERVAL_SECONDS:-86400}
      AUTO_START_DATE: ${AUTO_START_DATE:-}
      DOCUMENT_NAME_PATTERN: ${DOCUMENT_NAME_PATTERN:-}
      SENDER_USER_ID: ${SENDER_USER_ID:-}
      TEMPLATE_IDS: ${TEMPLATE_IDS:-}
      DOCUSIGN_AUTH_HOST: ${DOCUSIGN_AUTH_HOST:-account-d.docusign.com}
      DOCUSIGN_CLIENT_ID: ${DOCUSIGN_CLIENT_ID:-}
      DOCUSIGN_USER_ID: ${DOCUSIGN_USER_ID:-}
      DOCUSIGN_ACCOUNT_ID: ${DOCUSIGN_ACCOUNT_ID:-}
    volumes:
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/data
        target: /data
        bind:
          create_host_path: true
      - type: volume
        source: smb_downloads
        target: /downloads
        volume:
          nocopy: true
      - type: bind
        source: ${HOST_DATA_ROOT:-/srv/docker/docusign-downloader}/logs
        target: /logs
        bind:
          create_host_path: true



volumes:
  smb_downloads:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_SERVER:?Set SMB_SERVER}/${SMB_SHARE:?Set SMB_SHARE}"
      o: "username=${SMB_USERNAME:?Set SMB_USERNAME},password=${SMB_PASSWORD:?Set SMB_PASSWORD},domain=${SMB_DOMAIN:-WORKGROUP},vers=3.0,rw,uid=${PUID:-10001},gid=${PGID:-10001},forceuid,forcegid,file_mode=0600,dir_mode=0700"


