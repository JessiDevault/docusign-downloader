name: Test and publish container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: APP_PASSWORD=validation-password-only docker compose config -q
      - name: Verify initialization, interface, and persistent storage
        env:
          APP_PASSWORD: validation-password-only
          HOST_DATA_ROOT: ${{ runner.temp }}/docusign-test
        run: |
          docker build -t ghcr.io/jessidevault/docusign-downloader:main .
          docker compose up -d --wait --wait-timeout 120 downloader
          curl --fail http://127.0.0.1:8088/health
          curl --fail --user admin:validation-password-only http://127.0.0.1:8088/ | grep 'Recent jobs'
          docker compose exec -T downloader python -c "from pathlib import Path; p=Path('/config/persistence-test'); p.write_text('survives'); assert p.stat().st_uid == 10001"
          docker compose up -d --force-recreate --wait --wait-timeout 120 downloader
          docker compose exec -T downloader python -c "from pathlib import Path; assert Path('/config/persistence-test').read_text() == 'survives'; assert Path('/data/downloads.sqlite3').exists()"
      - name: Stop verification stack
        if: always()
        env:
          APP_PASSWORD: validation-password-only
          HOST_DATA_ROOT: ${{ runner.temp }}/docusign-test
        run: docker compose down
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jessidevault/docusign-downloader:main
            ghcr.io/jessidevault/docusign-downloader:sha-${{ github.sha }}
  deployment:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (main.data.object.sha !== context.sha) {
              core.notice('A newer source commit exists; leaving the deployment branch unchanged.');
              return;
            }
            const digest = process.env.IMAGE_DIGEST;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('Invalid published image digest');
            const source = fs.readFileSync('compose.yaml', 'utf8');
            const imageLine = 'image: ghcr.io/jessidevault/docusign-downloader:${IMAGE_TAG:-main}';
            if (!source.includes(imageLine)) throw new Error('Application image reference not found');
            const compose = source.replace(imageLine, 'image: ghcr.io/jessidevault/docusign-downloader@' + digest);
            const smbSource = fs.readFileSync('portainer-smb-stack.yml', 'utf8');
            const smbImage = /image: ghcr\.io\/jessidevault\/docusign-downloader@sha256:[a-f0-9]{64}/;
            if (!smbImage.test(smbSource)) throw new Error('SMB application image reference not found');
            const smbCompose = smbSource.replace(smbImage, 'image: ghcr.io/jessidevault/docusign-downloader@' + digest);
            let parent = context.sha;
            let exists = true;
            try {
              parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/deploy'})).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            const tree = await github.rest.git.createTree({owner, repo, tree: [
              {path: 'compose.yaml', mode: '100644', type: 'blob', content: compose},
              {path: 'portainer-smb-stack.yml', mode: '100644', type: 'blob', content: smbCompose},
              {path: 'portainer.env.example', mode: '100644', type: 'blob', content: fs.readFileSync('portainer.env.example', 'utf8')},
              {path: 'portainer-smb.env.example', mode: '100644', type: 'blob', content: fs.readFileSync('portainer-smb.env.example', 'utf8')},
              {path: 'README.md', mode: '100644', type: 'blob', content:
                '# Generated deployment\n\nSource: ' + context.sha + '\nImage: ' + digest +
                '\n\nUse refs/heads/deploy and compose.yaml in Portainer. Keep host configuration in Portainer environment variables. This branch is regenerated only after successful image publication. Edit source on main.\n'}
            ]});
            const commit = await github.rest.git.createCommit({owner, repo,
              message: 'Deploy image from ' + context.sha, tree: tree.data.sha, parents: [parent]});
            if (exists) {
              await github.rest.git.updateRef({owner, repo, ref: 'heads/deploy', sha: commit.data.sha, force: false});
            } else {
              await github.rest.git.createRef({owner, repo, ref: 'refs/heads/deploy', sha: commit.data.sha});
            }
